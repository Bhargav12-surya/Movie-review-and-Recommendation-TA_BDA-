[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinescope-academic"
version = "2.1.0"
description = "Movie review intelligence and hybrid recommendations for BDA and Text Analytics"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3",
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn==1.7.2",
  "joblib>=1.4,<2", "requests>=2.32,<3"
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "nbformat>=5.10,<6", "matplotlib>=3.8,<4", "seaborn>=0.13,<1", "pyarrow>=16,<23"]
transformers = ["torch>=2.4,<3", "transformers==4.57.3", "datasets>=3,<5", "accelerate>=1,<2", "sentence-transformers>=3,<6", "spacy>=3.8,<4", "rouge-score>=0.1.2"]
spark = ["pyspark==3.5.7"]
speech = ["faster-whisper>=1.1,<2", "python-multipart>=0.0.18"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "nbclient>=0.10,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
